<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flutter製試験対策アプリ。問題セット管理・演習・成績分析・間隔反復学習を一元管理。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="試験対策アプリ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>試験対策アプリ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* スプラッシュ画面 */
    body {
      margin: 0;
      padding: 0;
      background-color: #E8EAF6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #splash {
      text-align: center;
      color: #3F51B5;
    }

    #splash h1 {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 16px 0 8px;
      letter-spacing: 0.05em;
    }

    #splash p {
      font-size: 0.9rem;
      color: #7986CB;
      margin: 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #C5CAE9;
      border-top-color: #3F51B5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 20px auto 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="72" height="72" rx="18" fill="#3F51B5"/>
      <path d="M20 22h32v4H20zM20 32h24v4H20zM20 42h28v4H20z" fill="white"/>
      <circle cx="54" cy="44" r="10" fill="#FF5722"/>
      <path d="M50 44l3 3 5-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>試験対策アプリ</h1>
    <p>読み込み中...</p>
    <div class="spinner"></div>
  </div>

  <script>
    // Flutter 起動後にスプラッシュを非表示
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash');
      if (splash) {
        splash.style.transition = 'opacity 0.4s';
        splash.style.opacity = '0';
        setTimeout(() => splash.remove(), 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
